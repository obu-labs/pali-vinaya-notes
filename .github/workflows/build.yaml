name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Deploy App Token
        id: app-token
        uses: actions/create-github-app-token@main
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: obu-labs
          repositories: vinaya
          permission-actions: write
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sh downloaddeps.sh
      - run: python generate.py
      - uses: obu-labs/vinaya-notes-module-releaser@main
        id: releaser
        with:
          path: "Canon (Pali)"
          metadata_file: metadata.yaml
      - run: gh release upload v${{ steps.releaser.outputs.version }} data/scidmap.json
        env:
          GH_TOKEN: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh --repo obu-labs/vinaya workflow run build.yaml
